service: chilo-sls-integration

frameworkVersion: "*"

provider:
    name: aws
    runtime: python3.10
    stage: local
    region: us-east-1
    environment:
        PYTHONUNBUFFERED: "1"
        PYTHONPATH: "../../.."

plugins:
    - serverless-python-requirements
    - serverless-offline

custom:
    pythonRequirements:
        usePipenv: true
        slim: true
        dockerizePip: false
        invalidateCaches: true
        pythonBin: "../../.integration-venv/bin/python"

functions:
    pattern-v2:
        handler: handler.pattern_handler
        events:
            - httpApi:
                  path: /integration/pattern/{proxy+}
                  method: ANY
    directory-v2:
        handler: handler.directory_handler
        events:
            - httpApi:
                  path: /integration/directory/{proxy+}
                  method: ANY
    pattern-v1:
        handler: handler.pattern_handler_v1
        events:
            - http:
                  path: /integration-v1/pattern/{proxy+}
                  method: ANY
    directory-v1:
        handler: handler.directory_handler_v1
        events:
            - http:
                  path: /integration-v1/directory/{proxy+}
                  method: ANY
